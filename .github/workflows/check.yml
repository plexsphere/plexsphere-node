name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # This also covers both example hosts: the example-hosts-evaluate check
      # forces config.system.build.toplevel for each architecture, so no
      # per-architecture eval step is needed. --all-systems adds the aarch64
      # per-system outputs an x86_64 runner would otherwise skip.
      - name: flake check
        run: nix flake check --all-systems
      - name: verify pinned plexd release binaries
        run: |
          set -euo pipefail
          version=$(nix eval --raw .#packages.x86_64-linux.plexd.version)
          verify() {
            # Realizing the fixed-output fetch is what checks the pinned SRI
            # hash — everything above is evaluation only, so a mistyped or
            # swapped hash would otherwise first surface on a real deploy.
            # cosign then proves those exact bytes came from the plexd release
            # pipeline, not just from the same release page as the checksums.
            binary=$(nix build --no-link --print-out-paths ".#packages.x86_64-linux.plexd.sources.$1")
            curl -sSfL -o "$2.sigstore.json" \
              "https://github.com/plexsphere/plexd/releases/download/v$version/plexd-linux-$2.sigstore.json"
            # The Fulcio SAN is
            # https://github.com/OWNER/REPO/.github/workflows/FILE@REF, so
            # anchoring on the repository alone would accept a signature from
            # any workflow on any branch or pull-request ref — including one
            # an outside contributor can trigger. Pin the release workflow and
            # the tag refs it runs on; that also fixes the release URL above
            # to plexd's own releases, since curl -L normalizes '..'.
            cosign verify-blob \
              --certificate-identity-regexp '^https://github\.com/plexsphere/plexd/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-github-workflow-repository plexsphere/plexd \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --bundle "$2.sigstore.json" "$binary"
          }
          verify x86_64-linux amd64
          verify aarch64-linux arm64

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # No cosign installer here, unlike the check job: this job only builds an
      # image out of this flake and never fetches a signed plexd release.
      #
      # The image size is the one property of the medium that no evaluation
      # reveals, and it is what decides whether the result still fits the stick
      # an operator reaches for, so print it on every run rather than waiting
      # for a burn to fail.
      - name: build x86_64 installer image
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths .#packages.x86_64-linux.installer-iso)
          du -h "$out"/iso/*.iso
      # Only evaluated, not built: producing the aarch64 image needs an aarch64
      # builder, which an ubuntu-latest runner is not and emulation would not
      # make affordable. Evaluation still forces every module of the medium, so
      # a broken option, a failing assertion or a missing package surfaces here
      # just as it would in a build — what is skipped is squashing and
      # mastering an image nothing in CI boots.
      - name: evaluate aarch64 installer image
        run: nix eval .#packages.aarch64-linux.installer-iso.drvPath

  image:
    runs-on: ubuntu-latest
    # Pushes to main publish the image to a fixed URL. Two of them building at
    # once could finish their uploads out of order and leave the older image
    # behind that URL, so they share one group and run one after the other.
    # Every other run gets a group of its own and is not held back.
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'image-publish' || format('image-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # disko's builder is nixpkgs' vmTools.runInLinuxVM, whose derivation
      # requires the kvm system feature. The Nix daemon advertises it when
      # /dev/kvm exists and hands the device into the sandbox, where the
      # build runs as an unprivileged user outside the kvm group, so the
      # device has to be world-writable. The rule is the one GitHub's
      # changelog prescribes for hosted Linux runners
      # (https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/),
      # and it runs before Nix is installed so it is in place when the daemon
      # starts. If the build still stops because the kvm system feature is
      # missing, the daemon did not detect the device: add
      # system-features = nixos-test benchmark big-parallel kvm to
      # extra_nix_config below.
      - name: open /dev/kvm to the nix build users
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # No cosign installer here either: the plexd binaries the image carries
      # come from the pinned fixed-output fetches the check job verifies.
      #
      # The size of the compressed qcow2 is what every upload to an image
      # service transfers, and no evaluation reveals it, so print it on every
      # run.
      - name: build x86_64 machine image
        id: build
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths .#packages.x86_64-linux.image)
          du -h "$out"/*.qcow2
          echo "out=$out" >> "$GITHUB_OUTPUT"
      # Only evaluated, not built: producing the aarch64 image needs an aarch64
      # builder, which an ubuntu-latest runner is not and emulation would not
      # make affordable. Evaluation still forces every module of the image, so
      # a broken option, a failing assertion or a missing package surfaces here
      # just as it would in a build. What is skipped is installing the node
      # into a disk image nothing in CI boots.
      - name: evaluate aarch64 machine image
        run: nix eval .#packages.aarch64-linux.image.drvPath
      # A push to main publishes the x86_64 image to
      # https://get.plexsphere.com/node/, next to a .sha256 file that
      # sha256sum -c checks after a download. Pull requests never publish.
      # The SFTP root is the web root, and the upload creates node/ when it is
      # missing. The step reads four repository secrets:
      #
      #   SFTP_HOST         host name of the SFTP server
      #   SFTP_USER         the dedicated upload user
      #   SFTP_PASSWORD     that user's password
      #   SFTP_KNOWN_HOSTS  the server's host key lines, as ssh-keyscan prints
      #                     them; the host key is checked, never trusted on
      #                     first use, since a server that only claims to be
      #                     the host would receive the password
      #
      # sftp -b turns on BatchMode, which rules out password authentication.
      # ssh keeps the first value it gets for an option, so -o BatchMode=no
      # has to come before -b. The password reaches ssh through an askpass
      # script that prints it from the environment, so it is never written to
      # disk, and SSH_ASKPASS_REQUIRE=force makes ssh use that script without
      # a terminal or a display.
      #
      # Both files are uploaded under a hidden .part name and renamed into
      # place, so a download never reads a half-written image. The old file is
      # removed before each rename because a plain SFTP rename does not
      # replace an existing file. Leftover .part files of an aborted run are
      # removed first: sftp carries the store's read-only mode over to the
      # uploaded file, and a read-only .part could not be written again.
      - name: publish x86_64 machine image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIR: ${{ steps.build.outputs.out }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for secret in SFTP_HOST SFTP_USER SFTP_PASSWORD SFTP_KNOWN_HOSTS; do
            if [ -z "${!secret}" ]; then
              echo "::error::the repository secret $secret is not set"
              exit 1
            fi
          done
          image=plexsphere-node-image-x86_64-linux.qcow2
          cd "$RUNNER_TEMP"
          cat > sftp_askpass <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SFTP_PASSWORD"
          EOF
          chmod 700 sftp_askpass
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > sftp_known_hosts
          (cd "$IMAGE_DIR" && sha256sum "$image") > "$image.sha256"
          SSH_ASKPASS="$RUNNER_TEMP/sftp_askpass" SSH_ASKPASS_REQUIRE=force \
          sftp -o BatchMode=no -b - \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o UserKnownHostsFile=sftp_known_hosts -o StrictHostKeyChecking=yes \
            "$SFTP_USER@$SFTP_HOST" <<EOF
          -mkdir /node
          -rm /node/.$image.part
          -rm /node/.$image.sha256.part
          put $IMAGE_DIR/$image /node/.$image.part
          put $image.sha256 /node/.$image.sha256.part
          -rm /node/$image
          rename /node/.$image.part /node/$image
          -rm /node/$image.sha256
          rename /node/.$image.sha256.part /node/$image.sha256
          EOF
